<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Melania Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header"><div class="brand">Melania</div><nav aria-label="Main"><a href="#gallery">Gallery</a><a href="#about">About</a><button id="toggle" aria-label="Toggle theme">🌗</button></nav></header>
  <main>
    <section id="gallery" class="card" aria-labelledby="gallery-title">
      <h2 id="gallery-title">Gallery</h2>
      <div class="grid">
        <div class="tile" tabindex="0" aria-label="Tile 1"></div>
        <div class="tile" tabindex="0" aria-label="Tile 2"></div>
        <div class="tile" tabindex="0" aria-label="Tile 3"></div>
        <div class="tile" tabindex="0" aria-label="Tile 4"></div>
      </div>
    </section>
    <section id="about" class="card" aria-labelledby="about-title">
      <h2 id="about-title">About</h2>
      <p>Accessible, compact gallery with keyboard focus visuals.</p>
    </section>
  </main>
  <footer class="site-footer">© 2024 Melania</footer>
  <script src="script.js"></script>
</body>
</html>
